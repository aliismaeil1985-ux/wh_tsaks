  HOW TO INSTALL:

<!--  1) PRINT STYLESHEET  —  drop into <head>                    -->
<!-- ============================================================ -->
<style id="tania-print-styles">
/* ===== Screen styles for the off-DOM print container (always hidden) ===== */
#tania-print-root{ display:none; }

/* ===== PRINT-ONLY RULES =================================================== */
@media print{

  /* Page geometry — A4 portrait with 15 mm safe margin */
  @page{ size:A4 portrait; margin:15mm; }
  @page :first{ margin-top:15mm; }

  /* Hide EVERYTHING in the live app, then show ONLY the print root */
  html, body{
    background:#fff !important;
    margin:0 !important; padding:0 !important;
    -webkit-print-color-adjust:exact !important;
            print-color-adjust:exact !important;
    color:#0f172a !important;
    font-family:"Segoe UI", Tahoma, Arial, "Helvetica Neue", sans-serif !important;
    font-size:11pt;
  }
  body > *{ display:none !important; }
  body > #tania-print-root{ display:block !important; }

  /* All interactive / decorative elements are hidden inside the print root */
  #tania-print-root button,
  #tania-print-root .btn,
  #tania-print-root .pbtn,
  #tania-print-root input,
  #tania-print-root select,
  #tania-print-root textarea,
  #tania-print-root .toolbar,
  #tania-print-root .filters,
  #tania-print-root .no-print,
  #tania-print-root [data-no-print]{
    display:none !important;
  }

  /* ----- Page container ---------------------------------------------------- */
  .tp-page{
    page-break-after: always;
    break-after: page;
    padding:0;
  }
  .tp-page:last-child{ page-break-after:auto; break-after:auto; }

  /* ----- Header ------------------------------------------------------------ */
  .tp-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding-bottom:8px; margin-bottom:14px;
    border-bottom:2px solid #2563eb;
  }
  .tp-header .tp-logo{
    width:48px; height:48px; border-radius:8px;
    background:#2563eb; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:18px;
    flex-shrink:0;
  }
  .tp-header .tp-title{
    flex:1; text-align:center;
    font-size:16pt; font-weight:800; letter-spacing:.2px;
    color:#0f172a;
  }
  .tp-header .tp-meta{
    text-align:end; font-size:9pt; color:#475569; line-height:1.5;
    min-width:140px;
  }

  /* ----- Section labels ---------------------------------------------------- */
  .tp-section{ margin:14px 0 10px; page-break-inside:avoid; break-inside:avoid; }
  .tp-section-title{
    font-size:11pt; font-weight:800; color:#1e293b;
    padding:6px 10px; margin:0 0 8px;
    background:#f1f5f9; border-inline-start:4px solid #2563eb;
    border-radius:4px;
  }

  /* ----- Summary cards grid (4 per row) ------------------------------------ */
  .tp-cards{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-card{
    border:1px solid #cbd5e1; border-radius:6px;
    padding:10px 12px; background:#fff;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-card .tp-card-label{
    font-size:9pt; color:#64748b; font-weight:600;
    margin-bottom:4px; line-height:1.2;
  }
  .tp-card .tp-card-value{
    font-size:18pt; font-weight:900; color:#0f172a; line-height:1;
  }
  .tp-card .tp-card-sub{
    font-size:8pt; color:#94a3b8; margin-top:2px;
  }
  .tp-card.tp-c-total   { border-top:3px solid #2563eb; }
  .tp-card.tp-c-done    { border-top:3px solid #10b981; }
  .tp-card.tp-c-prog    { border-top:3px solid #f97316; }
  .tp-card.tp-c-pend    { border-top:3px solid #94a3b8; }
  .tp-card.tp-c-late    { border-top:3px solid #ef4444; }
  .tp-card.tp-c-postp   { border-top:3px solid #a855f7; }
  .tp-card.tp-c-cancel  { border-top:3px solid #64748b; }

  /* ----- Progress (replaces circular dials) -------------------------------- */
  .tp-progress-list{
    display:flex; flex-direction:column; gap:8px;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-progress-row{
    display:grid;
    grid-template-columns: 1fr 70px 50px;
    align-items:center; gap:10px;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-progress-row .tp-pr-label{
    font-size:10pt; font-weight:700; color:#334155;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tp-progress-row .tp-pr-bar{
    height:10px; background:#e2e8f0; border-radius:5px;
    overflow:hidden; border:1px solid #cbd5e1;
  }
  .tp-progress-row .tp-pr-fill{
    height:100%; background:#2563eb;
  }
  .tp-progress-row .tp-pr-pct{
    text-align:end;
    font-size:10pt; font-weight:800; color:#0f172a;
  }

  /* ----- Distribution tables (replace ApexCharts) -------------------------- */
  .tp-dist-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-dist-table{
    width:100%; border-collapse:collapse;
    font-size:10pt;
    page-break-inside:avoid; break-inside:avoid;
  }
  .tp-dist-table caption{
    text-align:start;
    font-size:10pt; font-weight:800; color:#1e293b;
    padding:4px 0 6px;
  }
  .tp-dist-table th, .tp-dist-table td{
    border:1px solid #cbd5e1; padding:5px 8px;
    text-align:start; vertical-align:middle;
  }
  .tp-dist-table th{
    background:#f1f5f9; font-weight:800; color:#1e293b;
    font-size:9pt; text-transform:uppercase; letter-spacing:.3px;
  }
  .tp-dist-table td.tp-num{ text-align:end; font-variant-numeric:tabular-nums; font-weight:700; }
  .tp-dist-table .tp-swatch{
    display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-inline-end:6px; vertical-align:middle;
    border:1px solid rgba(0,0,0,.12);
  }

  /* ----- Task table -------------------------------------------------------- */
  .tp-tasks-wrap{ page-break-before:auto; }
  .tp-tasks{
    width:100%; border-collapse:collapse;
    font-size:9pt;
    table-layout:fixed;
  }
  .tp-tasks thead{
    display:table-header-group;       /* repeat thead on every page */
  }
  .tp-tasks tfoot{ display:table-footer-group; }
  .tp-tasks tr{ page-break-inside:avoid; break-inside:avoid; }
  .tp-tasks th, .tp-tasks td{
    border:1px solid #cbd5e1; padding:5px 6px;
    text-align:start; vertical-align:top;
    word-wrap:break-word; overflow-wrap:anywhere;
  }
  .tp-tasks th{
    background:#1e293b; color:#fff;
    font-weight:800; font-size:9pt;
    text-align:start;
  }
  .tp-tasks tbody tr:nth-child(even) td{ background:#f8fafc; }
  .tp-tasks .tp-pill{
    display:inline-block; padding:1px 6px; border-radius:8px;
    font-size:8pt; font-weight:800; line-height:1.4;
    border:1px solid currentColor;
  }
  .tp-tasks .tp-late{ color:#b91c1c; font-weight:800; }

  /* ----- Footer / page-number -------------------------------------------- */
  .tp-footer{
    margin-top:14px; padding-top:6px;
    border-top:1px dashed #cbd5e1;
    display:flex; justify-content:space-between;
    font-size:8pt; color:#94a3b8;
  }

  /* ----- Optional grayscale mode ---------------------------------------- */
  #tania-print-root.tp-bw,
  #tania-print-root.tp-bw *{
    filter:grayscale(100%) !important;
    -webkit-filter:grayscale(100%) !important;
  }

  /* ----- LTR specific tweaks (mirrors borders correctly) ----------------- */
  [dir="ltr"] .tp-section-title{ border-inline-start:4px solid #2563eb; }
  [dir="rtl"] .tp-section-title{ border-inline-start:4px solid #2563eb; }
}

/* ===== Screen visibility of the off-DOM root (only during print prep) ===== */
@media screen{
  #tania-print-root{ display:none !important; }
}
</style>


<!-- ============================================================ -->
<!--  2) PRINT SCRIPT  —  drop into your main <script> block      -->
<!--     REPLACES: _printLoadH2C, _printDetectActivePage,         -->
<!--               _printCapture, printApp                        -->
<!-- ============================================================ -->
<script>
/* ==========================================================================
   TANIA — Pure-CSS print system v23
   - No html2canvas, no popup, no screenshot.
   - Builds a structured HTML report in a hidden #tania-print-root container,
     then calls window.print(). Browser renders it directly to A4 via @page.
   - Supports manager, employee, and admin pages.
   - Renders charts as flat data tables (Priority/Status distributions).
   - Replaces progress circles with horizontal bars + percentage labels.
   - Repeats <thead> on every page of the task table (thead { display:table-header-group }).
   - Works in both RTL (ar) and LTR (en) — picks up from <html dir="...">.
   ========================================================================== */

(function(){
  'use strict';

  /* ---------- tiny helpers ------------------------------------------------- */
  function _esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function _isAr(){
    try{ return (typeof LANG!=='undefined' && LANG==='ar') ||
                (document.documentElement.getAttribute('dir')||'').toLowerCase()==='rtl'; }
    catch(_e){ return true; }
  }
  function _tr(key, arFallback, enFallback){
    try{ if(typeof t==='function'){ var v=t(key); if(v && v!==key) return v; } }catch(_e){}
    return _isAr() ? arFallback : enFallback;
  }
  function _today(){
    try{ if(typeof today==='function') return today(); }catch(_e){}
    return new Date().toISOString().slice(0,10);
  }
  function _fmtDate(d){
    if(!d) return '—';
    try{ return new Date(d).toLocaleDateString(_isAr()?'ar-SA':'en-US',
            {year:'numeric',month:'short',day:'2-digit'}); }
    catch(_e){ return d; }
  }
  function _fmtDateTime(){
    try{ return new Date().toLocaleString(_isAr()?'ar-SA':'en-US',
            {year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
    catch(_e){ return new Date().toISOString(); }
  }
  function _userName(uid){
    try{ var u = (typeof getUser==='function') ? getUser(uid) : null; return u ? (u.name||u.ename||('#'+uid)) : ('#'+uid); }
    catch(_e){ return '#'+uid; }
  }
  function _userDept(uid){
    try{ var u = (typeof getUser==='function') ? getUser(uid) : null; return u ? (u.department||u.dept||'') : ''; }
    catch(_e){ return ''; }
  }
  function _staLabel(k){
    var m={
      pending:    _tr('staPending',    'انتظار',  'Pending'),
      in_progress:_tr('staInProgress', 'جارية',   'In Progress'),
      completed:  _tr('staCompleted',  'مكتملة',  'Completed'),
      postponed:  _tr('staPostponed',  'مؤجلة',   'Postponed'),
      cancelled:  _tr('staCancelled',  'ملغاة',   'Cancelled')
    };
    return m[k] || k || '—';
  }
  function _priLabel(k){
    var m={
      urgent:_tr('priUrgent','عاجل','Urgent'),
      high:  _tr('priHigh',  'عالية','High'),
      medium:_tr('priMedium','متوسطة','Medium'),
      low:   _tr('priLow',   'منخفضة','Low')
    };
    return m[k] || k || '—';
  }
  var STA_COLOR = { pending:'#94a3b8', in_progress:'#f97316', completed:'#10b981',
                    postponed:'#a855f7', cancelled:'#64748b' };
  var PRI_COLOR = { urgent:'#ef4444', high:'#f97316', medium:'#eab308', low:'#22c55e' };

  /* ---------- detect active page ------------------------------------------ */
  function _detectActivePage(){
    function vis(el){ return el && el.style.display!=='none' && el.offsetParent!==null; }
    var m=document.getElementById('pg-mgr');
    var e=document.getElementById('pg-emp');
    var a=document.getElementById('pg-admin');
    if(vis(m))   return 'mgr';
    if(vis(e))   return 'emp';
    if(vis(a))   return 'admin';
    return null;
  }

  /* ---------- gather data (no DOM scraping where possible) ---------------- */
  function _getEffectiveStatus(t, uid){
    try{
      if(uid!=null && typeof getTaskStatusForUser==='function'){
        var s=getTaskStatusForUser(t,uid); if(s) return s;
      }
    }catch(_e){}
    return t._userStatus || t.status || 'pending';
  }
  function _isLate(t, st){
    if(!t.deadline) return false;
    if(st==='completed'||st==='cancelled'||st==='postponed') return false;
    return t.deadline < _today();
  }
  function _baseTaskPool(){
    /* prefer non-template, non-archived tasks */
    var pool=[];
    try{
      if(window.DB && Array.isArray(DB.tasks)){
        pool = DB.tasks.filter(function(t){
          if(!t) return false;
          if(typeof isRecurringTemplate==='function' && isRecurringTemplate(t)) return false;
          if(t.archived) return false;
          return true;
        });
      }
    }catch(_e){}
    return pool;
  }
  function _expandPerUser(pool){
    /* one row per (task, assigned-user) — matches the live table */
    var out=[];
    pool.forEach(function(t){
      var ass = Array.isArray(t.assignedTo) ? t.assignedTo : (t.assignedTo?[t.assignedTo]:[null]);
      ass.forEach(function(uid){
        var st = _getEffectiveStatus(t, uid);
        out.push(Object.assign({}, t, {
          _displayUser: uid,
          _userStatus: st,
          _late: _isLate(t, st)
        }));
      });
    });
    return out;
  }
  function _gatherTasksForPage(page){
    var pool = _baseTaskPool();
    if(page==='emp'){
      var uid = (window.CU && CU.id) ? CU.id : null;
      pool = pool.filter(function(t){
        var a = Array.isArray(t.assignedTo)?t.assignedTo:(t.assignedTo?[t.assignedTo]:[]);
        return uid!=null && a.indexOf(uid)>-1;
      });
      return _expandPerUser(pool).filter(function(r){ return r._displayUser===uid; });
    }
    /* manager + admin → all rows */
    return _expandPerUser(pool);
  }

  /* ---------- summary calculations ---------------------------------------- */
  function _summary(rows){
    var s={ total:rows.length, pending:0, in_progress:0, completed:0,
            postponed:0, cancelled:0, late:0 };
    rows.forEach(function(r){
      var st=r._userStatus||'pending';
      if(s[st]!=null) s[st]++;
      if(r._late) s.late++;
    });
    return s;
  }
  function _byPriority(rows){
    var c={urgent:0,high:0,medium:0,low:0};
    rows.forEach(function(r){ var k=r.priority||'medium'; if(c[k]!=null) c[k]++; });
    return c;
  }
  function _byStatus(rows){
    var c={pending:0,in_progress:0,completed:0,postponed:0,cancelled:0};
    rows.forEach(function(r){ var k=r._userStatus||'pending'; if(c[k]!=null) c[k]++; });
    return c;
  }
  function _byEmployee(rows){
    var m={};
    rows.forEach(function(r){
      var uid=r._displayUser; if(uid==null) return;
      if(!m[uid]) m[uid]={ name:_userName(uid), total:0, completed:0 };
      m[uid].total++;
      if((r._userStatus||r.status)==='completed') m[uid].completed++;
    });
    return Object.keys(m).map(function(k){
      var e=m[k];
      e.pct = e.total ? Math.round(e.completed*100/e.total) : 0;
      return e;
    }).sort(function(a,b){ return b.pct-a.pct; });
  }

  /* ---------- HTML builders ----------------------------------------------- */
  function _hdr(title){
    var who = (window.CU && CU.name) ? CU.name : '—';
    var role = window.CU && CU.role
      ? (CU.role==='admin' ? _tr('roleAdmin','أدمن','Admin')
       : CU.role==='manager' ? _tr('roleManager','مدير','Manager')
       : _tr('roleEmployee','موظف','Employee'))
      : '';
    var lbl_user = _isAr() ? 'المستخدم' : 'User';
    var lbl_date = _isAr() ? 'التاريخ' : 'Date';
    return '<header class="tp-header">'
      +  '<div class="tp-logo">T</div>'
      +  '<div class="tp-title">'+_esc(title)+'</div>'
      +  '<div class="tp-meta">'
      +    '<div><strong>'+lbl_user+':</strong> '+_esc(who)+(role?' ('+_esc(role)+')':'')+'</div>'
      +    '<div><strong>'+lbl_date+':</strong> '+_esc(_fmtDateTime())+'</div>'
      +  '</div>'
      +'</header>';
  }
  function _footer(page, total){
    var brand = _isAr() ? 'منصة تانيا © 2026' : 'Tania Platform © 2026';
    var p = _isAr() ? ('صفحة '+page+' من '+total) : ('Page '+page+' of '+total);
    return '<div class="tp-footer"><span>'+_esc(brand)+'</span><span>'+_esc(p)+'</span></div>';
  }
  function _summarySection(s){
    var lbls = {
      total:      _isAr()?'إجمالي المهام'   :'Total Tasks',
      completed:  _staLabel('completed'),
      in_progress:_staLabel('in_progress'),
      pending:    _staLabel('pending'),
      late:       _isAr()?'متأخرة'         :'Overdue',
      postponed:  _staLabel('postponed'),
      cancelled:  _staLabel('cancelled')
    };
    var card = function(cls,lbl,val){
      return '<div class="tp-card '+cls+'">'
           + '<div class="tp-card-label">'+_esc(lbl)+'</div>'
           + '<div class="tp-card-value">'+val+'</div>'
           + '</div>';
    };
    return '<section class="tp-section">'
      +'<h2 class="tp-section-title">'+_esc(_isAr()?'الملخص':'Summary')+'</h2>'
      +'<div class="tp-cards">'
      +  card('tp-c-total', lbls.total,       s.total)
      +  card('tp-c-done',  lbls.completed,   s.completed)
      +  card('tp-c-prog',  lbls.in_progress, s.in_progress)
      +  card('tp-c-pend',  lbls.pending,     s.pending)
      +  card('tp-c-late',  lbls.late,        s.late)
      +  card('tp-c-postp', lbls.postponed,   s.postponed)
      +  card('tp-c-cancel',lbls.cancelled,   s.cancelled)
      +'</div></section>';
  }
  function _distSection(rows){
    var byP = _byPriority(rows), byS = _byStatus(rows);
    var lbl_pri = _isAr() ? 'التوزيع حسب الأولوية' : 'By Priority';
    var lbl_sta = _isAr() ? 'التوزيع حسب الحالة'   : 'By Status';
    var col_lbl = _isAr() ? 'العنصر' : 'Item';
    var col_cnt = _isAr() ? 'العدد'  : 'Count';

    function table(caption, order, labelFn, colorMap, data){
      var total = order.reduce(function(a,k){ return a+(data[k]||0); }, 0);
      var pct_h = _isAr()?'النسبة':'%';
      var html =
        '<table class="tp-dist-table"><caption>'+_esc(caption)+'</caption>'
        +'<thead><tr><th>'+_esc(col_lbl)+'</th><th class="tp-num">'+_esc(col_cnt)+'</th><th class="tp-num">'+_esc(pct_h)+'</th></tr></thead><tbody>';
      order.forEach(function(k){
        var v = data[k]||0;
        var pct = total ? Math.round(v*100/total) : 0;
        html += '<tr><td><span class="tp-swatch" style="background:'+(colorMap[k]||'#94a3b8')+'"></span>'
              + _esc(labelFn(k))+'</td>'
              + '<td class="tp-num">'+v+'</td>'
              + '<td class="tp-num">'+pct+'%</td></tr>';
      });
      html += '</tbody></table>';
      return html;
    }
    return '<section class="tp-section">'
      +'<h2 class="tp-section-title">'+_esc(_isAr()?'· جدول البيانات ·':'· Summary Tables ·')+'</h2>'
      +'<div class="tp-dist-grid">'
      +  table(lbl_pri, ['urgent','high','medium','low'],            _priLabel, PRI_COLOR, byP)
      +  table(lbl_sta, ['pending','in_progress','completed','postponed','cancelled'], _staLabel, STA_COLOR, byS)
      +'</div></section>';
  }
  function _progressSection(rows){
    var people = _byEmployee(rows);
    if(!people.length) return '';
    var ttl = _isAr() ? 'نسبة الإنجاز لكل موظف' : 'Completion % per Employee';
    var html = '<section class="tp-section">'
             + '<h2 class="tp-section-title">'+_esc(ttl)+'</h2>'
             + '<div class="tp-progress-list">';
    people.forEach(function(p){
      var pct = Math.max(0, Math.min(100, p.pct||0));
      html += '<div class="tp-progress-row">'
            +   '<div class="tp-pr-label">'+_esc(p.name)+' &nbsp;<small style="color:#94a3b8">('+p.completed+'/'+p.total+')</small></div>'
            +   '<div class="tp-pr-bar"><div class="tp-pr-fill" style="width:'+pct+'%;background:'
            +      (pct>=70?'#10b981':pct>=40?'#f59e0b':'#ef4444')+'"></div></div>'
            +   '<div class="tp-pr-pct">'+pct+'%</div>'
            + '</div>';
    });
    html += '</div></section>';
    return html;
  }
  function _tasksSection(rows){
    var headers = _isAr()
      ? ['#','الرقم','المهمة','المكلف','الإدارة','الأولوية','الحالة','تاريخ البدء','الموعد النهائي','التقدّم']
      : ['#','Serial','Task','Assignee','Department','Priority','Status','Start','Deadline','Progress'];

    var html = '<section class="tp-section tp-tasks-wrap">'
             + '<h2 class="tp-section-title">'+_esc(_isAr()?'قائمة المهام التفصيلية':'Task List')+'</h2>'
             + '<table class="tp-tasks">'
             + '<colgroup>'
             +   '<col style="width:4%"><col style="width:8%"><col style="width:22%">'
             +   '<col style="width:11%"><col style="width:10%"><col style="width:8%">'
             +   '<col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%">'
             + '</colgroup>'
             + '<thead><tr>';
    headers.forEach(function(h){ html += '<th>'+_esc(h)+'</th>'; });
    html += '</tr></thead><tbody>';

    if(!rows.length){
      html += '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:14px">'
            + _esc(_isAr()?'لا توجد مهام لعرضها':'No tasks to display')+'</td></tr>';
    } else {
      rows.forEach(function(r, i){
        var st = r._userStatus||'pending';
        var pri = r.priority||'medium';
        var prog = (typeof r._effectiveProgress==='number') ? r._effectiveProgress : (Number(r.progress)||0);
        var stColor = STA_COLOR[st]||'#64748b';
        var prColor = PRI_COLOR[pri]||'#64748b';
        var lateMark = r._late ? ' <span class="tp-late">'+(_isAr()?'⚠ متأخرة':'⚠ Late')+'</span>' : '';
        html += '<tr>'
          + '<td>'+(i+1)+'</td>'
          + '<td>'+_esc(r.serial||'—')+'</td>'
          + '<td><strong>'+_esc(r.title||'—')+'</strong>'+lateMark+'</td>'
          + '<td>'+_esc(_userName(r._displayUser))+'</td>'
          + '<td>'+_esc(_userDept(r._displayUser)||'—')+'</td>'
          + '<td><span class="tp-pill" style="color:'+prColor+'">'+_esc(_priLabel(pri))+'</span></td>'
          + '<td><span class="tp-pill" style="color:'+stColor+'">'+_esc(_staLabel(st))+'</span></td>'
          + '<td>'+_esc(_fmtDate(r.startDate||r.createdAt))+'</td>'
          + '<td>'+_esc(_fmtDate(r.deadline))+'</td>'
          + '<td>'+prog+'%</td>'
          + '</tr>';
      });
    }
    html += '</tbody></table></section>';
    return html;
  }

  /* ---------- main: build the full print document ------------------------- */
  function _buildReport(page){
    var rows = _gatherTasksForPage(page);
    var s    = _summary(rows);
    var titleMap = {
      mgr:   _isAr()?'📊 تقرير لوحة المدير — منصة تانيا':'📊 Manager Dashboard Report — Tania',
      emp:   _isAr()?'📋 تقرير الموظف — منصة تانيا'    :'📋 Employee Report — Tania',
      admin: _isAr()?'🛡️ تقرير الإدارة — منصة تانيا'   :'🛡️ Admin Report — Tania'
    };
    var title = titleMap[page] || titleMap.mgr;

    /* Page 1: header + summary + distributions (+ employee progress for mgr/admin) */
    var p1 = '<div class="tp-page">'
           +   _hdr(title)
           +   _summarySection(s)
           +   _distSection(rows)
           +   ((page==='mgr'||page==='admin') ? _progressSection(rows) : '')
           +   _footer(1, 2)
           + '</div>';

    /* Page 2+: detailed task table (browser splits long tables across pages,
       thead repeats automatically because of table-header-group) */
    var p2 = '<div class="tp-page">'
           +   _hdr(title)
           +   _tasksSection(rows)
           +   _footer(2, 2)
           + '</div>';

    return p1 + p2;
  }

  /* ---------- mount + print ----------------------------------------------- */
  function _ensureRoot(){
    var r = document.getElementById('tania-print-root');
    if(!r){
      r = document.createElement('div');
      r.id = 'tania-print-root';
      document.body.appendChild(r);
    }
    /* mirror current direction so RTL/LTR table alignment works correctly */
    r.setAttribute('dir', _isAr()?'rtl':'ltr');
    return r;
  }
  function _supportsAtPage(){
    try{ return (typeof CSS!=='undefined' && CSS.supports && CSS.supports('(width:1cm)')); }
    catch(_e){ return true; }
  }

  /* PUBLIC entry — replaces the old window.printApp */
  function printApp(){
    try{
      var page = _detectActivePage();
      if(!page){
        alert(_isAr()
          ? 'لم أتمكّن من تحديد الصفحة النشطة. تأكّد من تسجيل الدخول.'
          : 'Cannot detect active page. Please log in first.');
        return;
      }
      var root = _ensureRoot();

      /* Optional grayscale mode from admin print settings */
      var bw = false;
      try{
        var ps = JSON.parse(localStorage.getItem('printSettings')||'{}');
        bw = !!ps.printBW;
      }catch(_e){}
      root.className = bw ? 'tp-bw' : '';

      root.innerHTML = _buildReport(page);

      /* Fallback for very old browsers without @page support — just open dialog */
      if(!_supportsAtPage()){
        setTimeout(function(){ try{ window.print(); }catch(_e){} }, 50);
        return;
      }

      /* Standard path: trigger print on next frame so layout settles */
      requestAnimationFrame(function(){
        setTimeout(function(){
          try{ window.print(); }catch(_e){ console.warn('print() failed', _e); }
        }, 100);
      });

      /* Clean up after the print dialog closes (keeps the DOM tidy) */
      var done=false;
      function _after(){
        if(done) return; done=true;
        try{ root.innerHTML=''; }catch(_e){}
        window.removeEventListener('afterprint', _after);
      }
      window.addEventListener('afterprint', _after);
      setTimeout(_after, 60000); /* safety net */

    }catch(err){
      console.error('printApp error:', err);
      alert((_isAr()?'خطأ في الطباعة: ':'Print error: ') + (err && err.message || err));
    }
  }

  /* Expose globally (replaces old printApp) */
  window.printApp = printApp;

  /* Remove the dead html2canvas helpers so they can't be invoked accidentally */
  window._printLoadH2C       = function(){ return Promise.resolve(); };
  window._printCapture       = function(){ return Promise.resolve(null); };
  window._printDetectActivePage = _detectActivePage;
})();
</script>
